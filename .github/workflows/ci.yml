name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  list-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/list-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/list-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Docker image
        run: docker build -t catalog-list-service:ci .
